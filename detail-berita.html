<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>
        Detail Berita - Puskesmas Geyer 2
    </title>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">


    <style>

        body {

            background:#f5f7fa;

            color:#222;

        }


        .header {

            background:#27345f;

            padding:25px 0;

        }


        .article {

            background:#fff;

            border-radius:15px;

            padding:30px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.08);

        }


        .article-image {

            width:100%;

            max-height:500px;

            object-fit:cover;

            border-radius:12px;

            margin-bottom:25px;

        }


        .article-title {

            font-size:36px;

            font-weight:700;

            line-height:1.25;

            margin-bottom:15px;

        }


        .article-meta {

            color:#777;

            margin-bottom:25px;

        }


        .article-content {

            font-size:17px;

            line-height:1.8;

            white-space:pre-line;

        }


        .back-button {

            margin-bottom:25px;

        }


        @media(max-width:768px){

            .article {

                padding:20px;

            }


            .article-title {

                font-size:28px;

            }


            .article-content {

                font-size:16px;

            }

        }

    </style>

    <style>

/* =========================================
   NAVBAR PUSKESMAS GEYER 2
   SAMA DENGAN BERITA.HTML
   ========================================= */

.navbar {
    background-color: #273765 !important;
    min-height: 90px;
    padding: 14px 0 !important;
}

/* Container */
.navbar .container {
    max-width: 1200px;
}

/* Logo + nama */
.navbar-brand {
    display: flex !important;
    align-items: center;
    gap: 10px;
    text-decoration: none !important;
    margin-right: 35px;
}

/* Logo */
.navbar-brand img {
    width: 58px !important;
    height: 58px !important;
    object-fit: contain;
}

/* Nama Puskesmas */
.navbar-brand .brand-text {
    color: #ffffff !important;
    font-size: 17px;
    line-height: 1.15;
    font-weight: 700;
    white-space: nowrap;
}

/* MENU */
.navbar-nav {
    align-items: center;
    gap: 3px;
}

.navbar-nav .nav-link {
    color: #ffffff !important;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 10px !important;
    white-space: nowrap;
    transition: 0.2s ease;
}

/* Hover */
.navbar-nav .nav-link:hover {
    color: #20c4e8 !important;
}

/* Menu aktif */
.navbar-nav .nav-link.active {
    color: #20c4e8 !important;
}

/* Tombol layanan darurat */
.navbar-nav .custom-btn {
    background-color: #1677ff !important;
    color: #ffffff !important;
    border-radius: 30px;
    padding: 10px 18px !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    margin-left: 8px;
}

.navbar-nav .custom-btn:hover {
    background-color: #0d63d8 !important;
    color: #ffffff !important;
}


/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 991px) {

    .navbar {
        padding: 10px 15px !important;
    }

    .navbar-brand {
        margin-right: 0;
    }

    .navbar-brand img {
        width: 52px !important;
        height: 52px !important;
    }

    .navbar-brand .brand-text {
        font-size: 16px;
    }

    .navbar-nav {
        gap: 0;
        margin-top: 10px;
        align-items: flex-start;
    }

    .navbar-nav .nav-link {
        padding: 9px 0 !important;
        font-size: 14px;
    }

    .navbar-nav .custom-btn {
        margin-left: 0;
        margin-top: 8px;
    }

}

</style>

</head>



<body>


<!-- =====================================================
     HEADER
====================================================== -->

<header class="header">

    <div
        class="container
               d-flex
               justify-content-between
               align-items-center">

        <h2
            class="text-white mb-0">

            Puskesmas Geyer 2

        </h2>


        <a
            href="index.html"
            class="btn btn-light">

            <i class="bi bi-house"></i>

            Beranda

        </a>

    </div>

</header>



<!-- =====================================================
     CONTENT
====================================================== -->

<main
    class="container py-5">


    <!-- TOMBOL KEMBALI -->

    <a
        href="berita.html"
        class="btn btn-outline-success back-button">

        <i class="bi bi-arrow-left"></i>

        Kembali ke Berita

    </a>



    <!-- =================================================
         DETAIL BERITA
    ================================================== -->

    <article
        id="detail-container"
        class="article">


        <!-- LOADING -->

        <div
            class="text-center py-5">

            <div
                class="spinner-border text-success"
                role="status">

            </div>


            <p class="mt-3">

                Memuat berita...

            </p>

        </div>


    </article>


</main>



<!-- =====================================================
     API
====================================================== -->

<script src="js/api.js"></script>


<!-- =====================================================
     DETAIL BERITA
====================================================== -->

<script src="js/detail-berita.js"></script>


</body>

</html>
